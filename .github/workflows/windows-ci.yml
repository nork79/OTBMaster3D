name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q main.py otb_chess otb_chess_core tests tools
      # Qt/GLFW rendering tests require a working native OpenGL display.
      - name: Run tests without a graphics context
        run: python -m unittest -v tests.test_bookmarks tests.test_bookmark_ui.BookmarkIntegrationTests tests.test_chess_backend tests.test_documents tests.test_notation_boundary tests.test_otb_chess_core tests.test_board_highlights tests.test_static_evaluation tests.test_engine_features.EngineFeatureTests tests.test_difficulty.DifficultyTests tests.test_piece_sets.AssetTests

  engine-integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Stockfish
        run: python tools/install_stockfish.py
      - name: Install Fairy-Stockfish
        run: python tools/install_fairy_stockfish.py
      - name: Require installed difficulty engines
        run: >-
          python -c "from otb_chess.services.difficulty import DIFFICULTIES, missing_files; missing = {key: missing_files(key) for key in DIFFICULTIES if missing_files(key)}; assert not missing, missing"
      # Rodent needs MinGW; its tests remain optional when it is not installed.
      - name: Run live engine tests
        run: python -m unittest -v tests.test_difficulty.DifficultyIntegrationTests tests.test_engine_features.EngineIntegrationTests tests.test_bookmark_ui.BookmarkEngineIntegrationTests tests.test_rodent
